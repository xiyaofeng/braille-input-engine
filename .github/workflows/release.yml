name: optional-github-release-assets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (v4)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node (v4)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack:release
      - run: npm run verify:release-asset
      - name: Upload release candidate assets (v4)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: braille-input-engine-release-candidate
          path: release/
